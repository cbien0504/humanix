name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # compile, 300+ unit tests, enforcer rules, JaCoCo gate (com.hrm.service ≥ 60 % lines);
      # integration tests skip themselves because HRM_IT_DB_URL is not set here
      - run: ./mvnw -B verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            target/surefire-reports
            target/site/jacoco
      - uses: actions/upload-artifact@v4
        with:
          name: hrm-war
          path: target/hrm.war

  integration:
    name: Integration tests on SQL Server 2022
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # throw-away passwords generated per run and masked in the log – nothing secret lives in the repo
      - name: Start SQL Server
        run: |
          SA="Sa-$(openssl rand -hex 12)-9aA!"
          APP="App-$(openssl rand -hex 12)-9aA!"
          echo "::add-mask::$SA"
          echo "::add-mask::$APP"
          echo "SA_PASSWORD=$SA" >> "$GITHUB_ENV"
          echo "APP_DB_PASSWORD=$APP" >> "$GITHUB_ENV"
          docker run -d --name mssql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA" -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
      - name: Create schema, procedures, triggers and demo data
        run: |
          docker cp db mssql:/tmp/db
          docker exec -e DB_ADMIN_PASSWORD="$SA_PASSWORD" -e APP_DB_PASSWORD="$APP_DB_PASSWORD" mssql bash /tmp/db/init-db.sh
      - name: Unit and integration tests
        run: ./mvnw -B verify
        env:
          HRM_IT_DB_URL: jdbc:sqlserver://localhost:1433;databaseName=HRM;encrypt=true;trustServerCertificate=true
          HRM_IT_DB_USER: hrm_app
          HRM_IT_DB_PASSWORD: ${{ env.APP_DB_PASSWORD }}
      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: target/failsafe-reports
      - name: SQL Server log on failure
        if: failure()
        run: docker logs mssql | tail -n 100

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hrm-system:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
