# -----------------------------------------------------------------------------
# Application settings (business rules that HR may tune without code changes)
# ${NAME:default} placeholders are resolved from environment / system properties.
# -----------------------------------------------------------------------------
app.name=HRM System
app.version=1.0.0
app.timezone=${HRM_TIMEZONE:Asia/Ho_Chi_Minh}

# Attendance (BR-11, BR-12)
attendance.workStart=08:30
attendance.lateGraceMinutes=5
attendance.halfDayMaxHours=4

# Leave (BR-20)
leave.maxPastDays=30

# Security (NFR-01, NFR-04)
security.maxFailedLogins=5
security.lockMinutes=15
security.passwordMinLength=8
security.bcryptCost=10
# Shared secret for system-to-system REST calls (header X-API-Key); empty = API key access disabled
security.apiKey=${HRM_API_KEY:}
# Send the session cookie with the Secure flag (enable behind HTTPS)
security.cookieSecure=${HRM_COOKIE_SECURE:false}

# UI
ui.pageSize=10
