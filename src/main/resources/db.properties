# -----------------------------------------------------------------------------
# Database connection – NO secrets in this file.
# Every value can be overridden by an environment variable or JVM system
# property using the ${NAME:default} syntax resolved by com.hrm.config.AppConfig.
# -----------------------------------------------------------------------------
# encrypt=true is the driver default; trustServerCertificate=true only suits the
# self-signed certificate of a local/Docker SQL Server – set HRM_DB_URL with a
# trusted certificate in production.
db.url=${HRM_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=HRM;encrypt=true;trustServerCertificate=true;applicationName=HRM-Web}
db.username=${HRM_DB_USER:hrm_app}
db.password=${HRM_DB_PASSWORD:}

# HikariCP connection pool
db.pool.maximumPoolSize=${HRM_DB_POOL_SIZE:10}
db.pool.minimumIdle=2
db.pool.connectionTimeoutMs=5000
db.pool.idleTimeoutMs=300000
db.pool.maxLifetimeMs=1800000
# log a warning (with stack trace) when a connection is held longer than this
db.pool.leakDetectionThresholdMs=30000

# statements slower than this are logged at WARN level
db.slowQueryMs=${HRM_DB_SLOW_QUERY_MS:500}
