db.url=${HRM_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=HRM;encrypt=true;trustServerCertificate=true;applicationName=HRM-Web}
db.username=${HRM_DB_USER:hrm_app}
db.password=${HRM_DB_PASSWORD:}

db.pool.maximumPoolSize=${HRM_DB_POOL_SIZE:10}
db.pool.minimumIdle=2
db.pool.connectionTimeoutMs=5000
db.pool.idleTimeoutMs=300000
db.pool.maxLifetimeMs=1800000
db.pool.leakDetectionThresholdMs=30000

db.slowQueryMs=${HRM_DB_SLOW_QUERY_MS:500}
